schema_version: 1

context:
  name: jupyter_server_fileid
  version: "0.10.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 1f505d8e651820e62ec4865397d2688f4fec174b472d039a5288d1c1ab857172

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - jupyter-fileid = jupyter_server_fileid.cli:main

requirements:
  host:
    - hatchling >=1.0
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }}
    - jupyter_server >=2.10,<3
    - jupyter_events >=0.9.0

tests:
  - python:
      imports:
        - jupyter_server_fileid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A Jupyter Server extension providing an implementation of the File ID service.
  description: |
    A Jupyter Server extension providing an implementation of the File ID service.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/jupyter-server/jupyter_server_fileid

extra:
  recipe-maintainers:
    - davidbrochart
    - dlqqq
    - fcollonval
